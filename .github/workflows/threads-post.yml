name: Threads 自動投稿

on:
  schedule:
    # 1日12回。時刻は UTC で書きます（日本時間 = UTC + 9時間）。
    # GitHub の混み具合で数分〜数十分遅れることがあります。
    - cron: "47 21 * * *" #  6:47 ごろ（日本時間）
    - cron: "13 23 * * *" #  8:13 ごろ
    - cron: "41 0 * * *" #  9:41 ごろ
    - cron: "7 2 * * *" # 11:07 ごろ
    - cron: "29 3 * * *" # 12:29 ごろ
    - cron: "53 4 * * *" # 13:53 ごろ
    - cron: "17 6 * * *" # 15:17 ごろ
    - cron: "43 7 * * *" # 16:43 ごろ
    - cron: "11 9 * * *" # 18:11 ごろ
    - cron: "37 10 * * *" # 19:37 ごろ
    - cron: "3 12 * * *" # 21:03 ごろ
    - cron: "31 13 * * *" # 22:31 ごろ
  workflow_dispatch:
    inputs:
      dry_run:
        description: "テスト実行（チェックを入れると、投稿文を作るだけで投稿しません）"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: threads-bot
  cancel-in-progress: false

jobs:
  # 定期実行で実際に投稿するのは、threads_bot/config.toml の enabled が true のときだけです
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: threads_bot/requirements.txt

      - name: 必要なライブラリを入れる
        run: pip install -r threads_bot/requirements.txt

      - name: 投稿時刻を少しずらす（0〜10分）
        if: github.event_name == 'schedule'
        run: sleep $(( RANDOM % 600 ))

      - name: 投稿文を作って Threads に投稿する
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: python -m threads_bot.post

      - name: 投稿履歴をリポジトリに保存する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add threads_bot/data/history.jsonl
          if git diff --cached --quiet; then
            echo "保存する履歴はありません"
            exit 0
          fi
          git commit -m "Threads の投稿履歴を更新"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
