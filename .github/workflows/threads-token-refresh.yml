name: Threads トークン自動更新

# Threads のトークンは60日で切れるため、毎週期限を延ばして Secrets に保存し直します。
on:
  schedule:
    - cron: "21 18 * * 1" # 毎週火曜 3:21 ごろ（日本時間）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: threads_bot/requirements.txt

      - name: 必要なライブラリを入れる
        run: pip install -r threads_bot/requirements.txt

      - name: トークンの期限を延ばして保存する
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          GH_TOKEN: ${{ secrets.GH_PAT_FOR_SECRETS }}
        run: python -m threads_bot.token_tool refresh
