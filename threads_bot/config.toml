# ===== Threads 自動投稿ボットの設定 =====
# GitHub の画面でこのファイルを編集して保存すると、次の投稿から反映されます。
# 「"」で囲まれた部分だけを書き換えてください。

[account]
# アカウントのテーマ（何について投稿するか）
theme = "AIを仕事や毎日の作業に活かすコツ"

# 誰に向けて書くか
audience = "AIに興味はあるけれど、まだ使いこなせていない社会人"

# 文体
tone = "親しみやすい「です・ます」調。専門用語はかみ砕いて説明する。"

# Threads のトピックタグ（1投稿に1つだけ付けられます。不要なら "" にする）
topic_tag = "AI活用"

[post]
# 1投稿の最大文字数（Threads の上限は500文字。余裕をもたせて400）
max_chars = 400

# 投稿のパターン。投稿のたびに上から順番に使われます。
formats = [
  "今日から使える小ワザを1つ、具体的な手順つきで紹介する",
  "初心者がやりがちな勘違いを1つ取り上げ、正しい考え方を説明する",
  "よくある質問に1つ答える（Q&A形式）",
  "作業を楽にするためのチェックリストを3〜5項目で示す",
  "読者に答えやすい質問を投げかけて、考えるきっかけを作る",
  "AIを使うときの注意点（情報の確認、個人情報の扱いなど）を1つ説明する",
]

# 投稿に入っていたら作り直す言葉
ng_words = ["絶対儲かる", "必ず稼げる", "確実に稼げる", "フォローお願いします"]

[link]
# アフィリエイトサイトなどのURL。空のままならリンクは付けません。
url = ""

# 何回に1回リンクを付けるか（0 ならリンクを付けない）
every = 0

# リンク付き投稿の先頭に付ける広告表記
label = "【PR】"

[ai]
# 投稿文を書く AI のモデル
model = "claude-opus-5-5"

# どれだけ考えさせるか（low / medium / high）
effort = "medium"
